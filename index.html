<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The AI Advocate — Coming Soon</title>
  <meta name="description" content="Independent ratings for AI tools. 100-point scale. Inspired by Robert Parker.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%237c2933'/%3E%3Ctext x='100' y='128' font-family='Georgia,serif' font-size='72' font-weight='700' text-anchor='middle' fill='%23f5f1e8'%3E100%3C/text%3E%3C/svg%3E">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: #f5f1e8; color: #1a2238; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      line-height: 1.5;
    }
    .container { max-width: 640px; width: 100%; text-align: center; }
    .logo { width: 100%; max-width: 380px; height: auto; margin: 0 auto 2.5rem; display: block; }
    .tagline {
      font-size: 1.5rem;
      font-style: italic;
      color: #7c2933;
      margin-bottom: 2.5rem;
      letter-spacing: 0.02em;
    }
    .body-text {
      font-size: 1.35rem;
      line-height: 1.7;
      margin-bottom: 3rem;
      opacity: 0.9;
    }
    .rules {
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #7c2933;
      font-weight: 700;
      margin-bottom: 3rem;
    }
    .footer {
      font-size: 1.1rem;
      opacity: 0.8;
      border-top: 1px solid #7c2933;
      padding-top: 1.5rem;
      margin: 0 auto;
      max-width: 420px;
      line-height: 1.7;
    }
    .footer a {
      color: #7c2933;
      text-decoration: none;
      font-weight: 600;
      border-bottom: 1px solid #7c2933;
    }
    .footer a:hover { background: #7c2933; color: #f5f1e8; }
    @media (max-width: 480px) {
      .logo { max-width: 260px; }
      .tagline { font-size: 1.25rem; }
      .body-text { font-size: 1.1rem; }
      .rules { font-size: 0.85rem; letter-spacing: 0.25em; }
      .footer { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" class="logo" aria-label="The AI Advocate">
      <rect width="500" height="500" fill="#f5f1e8"/>
      <text x="220" y="320" font-family="Georgia, 'Times New Roman', serif" font-size="290" font-weight="700" text-anchor="middle" fill="#1a2238">A</text>
      <circle cx="360" cy="185" r="75" fill="#7c2933" stroke="#f5f1e8" stroke-width="4"/>
      <text x="360" y="207" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" text-anchor="middle" fill="#f5f1e8">100</text>
      <line x1="40" y1="362" x2="95" y2="362" stroke="#7c2933" stroke-width="1"/>
      <line x1="405" y1="362" x2="460" y2="362" stroke="#7c2933" stroke-width="1"/>
      <text x="250" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="5"><tspan fill="#1a2238">THE </tspan><tspan fill="#7c2933">AI</tspan><tspan fill="#1a2238"> ADVOCATE</tspan></text>
    </svg>

    <p class="tagline">Simple AI scoring. Inspired by Robert Parker.</p>

    <p class="body-text">
      100-point scale. Rules anyone can read in 60 seconds.
    </p>

    <div class="footer">
      Launching soon.<br>
      To be notified when the first reviews drop:<br>
      <a href="https://ai-advocate.beehiiv.com">Subscribe to the newsletter &rarr;</a>
    </div>
  </main>
</body>
</html>
